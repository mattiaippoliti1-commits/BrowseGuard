<!DOCTYPE html>
<!-- BrowserGuard Popup -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BrowserGuard</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>BrowserGuard</h1>

        <p class="subtitle">
            Real-Time Web Risk Detection
        </p>

        <div class="card">

            <h2>URL Analysis</h2>

            <div class="analysis-row">
                <span>Protocol</span>
                <span id="protocol">Loading...</span>
            </div>

            <div class="analysis-row">
                <span>Hostname</span>
                <span id="hostname">Loading...</span>
            </div>

            <div class="analysis-row">
                <span>URL Length</span>
                <span id="url-length">Loading...</span>
            </div>

            <div class="analysis-row">
                <span>Subdomains</span>
                <span id="subdomains">Loading...</span>
            </div>

            <div class="analysis-row">
                <span>IP Address</span>
                <span id="ip-address">Loading...</span>
            </div>

            <div class="analysis-row">
                <span>Punycode</span>
                <span id="punycode">Loading...</span>
            </div>

        </div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
